name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, goos: linux, goarch: amd64}
          - {runner: ubuntu-24.04-arm, goos: linux, goarch: arm64}
          - {runner: macos-15-intel, goos: darwin, goarch: amd64}
          - {runner: macos-15, goos: darwin, goarch: arm64}
          - {runner: windows-2025, goos: windows, goarch: amd64, msystem: UCRT64, cc: gcc, package: mingw-w64-ucrt-x86_64-gcc}
          - {runner: windows-11-arm, goos: windows, goarch: arm64, msystem: CLANGARM64, cc: clang, package: mingw-w64-clang-aarch64-clang}
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: '1'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Linux static toolchain
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
      - name: Set up Windows C toolchain
        if: matrix.goos == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: ${{ matrix.package }}
          path-type: inherit
      - name: Test Unix
        if: matrix.goos != 'windows'
        run: go test ./...
      - name: Test Windows
        if: matrix.goos == 'windows'
        shell: msys2 {0}
        env:
          CC: ${{ matrix.cc }}
        run: go test ./...
      - name: Build Unix
        if: matrix.goos != 'windows'
        shell: bash
        env:
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=dev
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$REF" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            version="$REF"
          fi
          mkdir -p package dist
          flags="-s -w -X main.version=$version"
          if [[ "$GOOS" == linux ]]; then
            flags="$flags -linkmode external -extldflags -static"
          fi
          go build -trimpath -ldflags "$flags" -o package/ronin ./cmd/ronin
          package/ronin --version
          tar -C package -czf "dist/ronin_${version}_${GOOS}_${GOARCH}.tar.gz" ronin
      - name: Build Windows
        if: matrix.goos == 'windows'
        shell: msys2 {0}
        env:
          CC: ${{ matrix.cc }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=dev
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$REF" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            version="$REF"
          fi
          mkdir -p package dist
          go build -trimpath -ldflags "-s -w -X main.version=$version -linkmode external -extldflags -static" -o package/ronin.exe ./cmd/ronin
          # Smoke test without MSYS2 DLL directories in PATH.
          PATH=/c/Windows/System32 package/ronin.exe --version
          powershell.exe -NoProfile -Command "Compress-Archive -Path package/ronin.exe -DestinationPath dist/ronin_${version}_${GOOS}_${GOARCH}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ronin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ronin-*
          path: dist
          merge-multiple: true
      - name: Publish all six archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)
          gh release create "$TAG" dist/* --title "$TAG" --generate-notes
